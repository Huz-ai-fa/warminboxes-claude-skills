# Rebuilds the `directory` branch from plugins/warminboxes on every push to
# main that touches it.
#
# The Claude plugin directory submission reads the repository ROOT of the
# branch it tracks, and accepts only a folder holding one plugin and nothing
# else. main holds two plugins, the marketplace and the Cursor plugin, so the
# submission tracks `directory`, whose root is plugins/warminboxes and nothing
# more. Edit the plugin on main; this keeps the branch in step. Each run adds
# one commit on top of the branch (no force-push), so the directory sees a
# new version per change and the branch keeps its history.
name: directory branch

on:
  push:
    branches: [main]
    paths: ['plugins/warminboxes/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directory-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit plugins/warminboxes as the root of `directory`
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          tree=$(git rev-parse HEAD:plugins/warminboxes)
          parent_args=()
          if git fetch origin directory 2>/dev/null; then
            # Nothing to do when the plugin folder is unchanged.
            if [ "$(git rev-parse FETCH_HEAD^{tree})" = "$tree" ]; then
              echo "directory already matches main"; exit 0
            fi
            parent_args=(-p FETCH_HEAD)
          fi
          commit=$(git commit-tree "$tree" "${parent_args[@]}" -m "Directory build of plugins/warminboxes from main@${GITHUB_SHA::7}

          Generated by .github/workflows/directory-branch.yml; edit main, not this branch.")
          git push origin "$commit:refs/heads/directory"
